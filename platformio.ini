[platformio]
default_envs = tab5_basis
core_dir = .pio-core
; Lokale Anschlüsse dieses Rechners (upload_port, monitor_port), nicht versioniert.
extra_configs = platformio_lokal.ini

[env:tab5_basis]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = retroradio-tab5
board_build.partitions = partitions_tab5.csv
build_type = release
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.33
    https://github.com/m5stack/M5Unified.git#0.2.26
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
monitor_speed = 115200
upload_speed = 921600
; Der Standardupload schreibt boot_app0 nach 0xe000 und würde vorhandenes NVS überschreiben.
upload_protocol = custom
extra_scripts =
    pre:scripts/generate_html_header.py
    pre:scripts/fw_version.py
    post:scripts/tab5_upload.py
