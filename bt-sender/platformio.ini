; Firmware des Bluetooth-Senders auf dem ESP32-PICO-D4 (M5Stamp Pico DIY Kit), Anschlüsse und Protokoll in README.md.
[platformio]
default_envs = bt_sender
; Pakete des Hauptprojekts mitbenutzen, damit Platform, Framework und Werkzeuge nur einmal geladen werden.
core_dir = ../.pio-core
; Anschluss des Programmieradapters an diesem Rechner (upload_port, monitor_port), nicht versioniert. Fehlt die Datei, gilt --upload-port oder die Portwahl von PlatformIO.
extra_configs = platformio_lokal.ini

[env:bt_sender]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = m5stamp-pico
; Eine App mit 3 MiB statt zwei OTA-Plätzen zu je 1,25 MiB: OTA ist nicht vorgesehen, und Bluedroid mit A2DP belegt allein rund 1 MiB. NVS (20 KiB) hält Kopplungsschlüssel und letzte Adresse.
board_build.partitions = huge_app.csv
build_type = release
; ESP32-A2DP v1.8.11, fest auf den Tag-Commit.
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#b6da4744286ca15b6f1dee607c077a4747294dd4
build_flags =
    -DCORE_DEBUG_LEVEL=3
; Git-Commit des Builds als Zusatz zum Firmwarestand (HALLO STAND=<Nummer>+<Commit>), damit jeder geflashte Pico eindeutig zuzuordnen ist.
extra_scripts = pre:git_stand.py
monitor_speed = 115200
upload_speed = 921600
